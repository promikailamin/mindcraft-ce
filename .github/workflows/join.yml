name: Join Minecraft Server

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      ${{ github.event.issue.title == 'join' ||
          github.event.issue.title == 'Join' ||
          github.event.issue.title == 'JOIN' }}

    steps:
      - name: Parse connection details from issue
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          ip="$(grep -ioE 'ip=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r[:space:]')"
          port="$(grep -ioE 'port=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r[:space:]')"
          auth="$(grep -ioE 'auth=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r[:space:]')"
          name="$(grep -ioE 'name=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r[:space:]')"
          version="$(grep -ioE 'version=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r[:space:]')"
          message="$(grep -ioE 'message=[^[:space:],;]+' <<< "$BODY" | head -1 | cut -d= -f2- | tr -d '\r')"

          if [ -z "$ip" ] || [ -z "$port" ]; then
            echo "::error title=Missing details::Issue body must contain 'ip=...' and 'port=...' lines"
            echo "expected format: ip=<host or ip>  port=<minecraft port>"
            exit 1
          fi

          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: Comment starting setup
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Setting up the Andy bot to join \`${{ steps.parse.outputs.ip }}:${{ steps.parse.outputs.port }}\`...`
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python-is-python3 \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev \
            libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libgles2-mesa-dev libosmesa6-dev

      - name: Install ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama is ready"
              break
            fi
            sleep 2
          done

      - name: Pull andy model
        run: |
          ollama pull sweaterdog/andy-4:micro-q8_0
          ollama pull embeddinggemma

      - name: Install project dependencies
        run: npm ci

      - name: Join Minecraft server
        id: join
        env:
          IP: ${{ steps.parse.outputs.ip }}
          PORT: ${{ steps.parse.outputs.port }}
          AUTH: ${{ steps.parse.outputs.auth }}
          NAME: ${{ steps.parse.outputs.name }}
          VERSION: ${{ steps.parse.outputs.version }}
          MESSAGE: ${{ steps.parse.outputs.message }}
        run: |
          export OLLAMA_URL="http://localhost:11434"
          export MINECRAFT_PORT="$PORT"
          export PROFILES='["./profiles/andy.json"]'

          if [ -n "$NAME" ]; then
            node -e "const fs=require('fs');const p='profiles/andy.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='$NAME';fs.writeFileSync(p,JSON.stringify(j,null,4))"
          fi

          settings='{"host":"'"$IP"'","auto_open_ui":false'
          if [ -n "$AUTH" ]; then settings="$settings,\"auth\":\"$AUTH\""; fi
          if [ -n "$VERSION" ]; then settings="$settings,\"minecraft_version\":\"$VERSION\""; fi
          if [ -n "$MESSAGE" ]; then settings="$settings,\"init_message\":\"$MESSAGE\""; fi
          settings="$settings}"
          export SETTINGS_JSON="$settings"

          echo "Connecting to $IP:$PORT with model sweaterdog/andy-4:micro-q8_0"

          attempts=0
          while true; do
            node main.js
            code=$?
            attempts=$((attempts + 1))
            echo "Bot exited with code $code (attempt $attempts). Restarting in 10 seconds..."
            if [ "$attempts" -ge 5 ]; then
              echo "::error::Bot failed 5 times. Giving up."
              exit 1
            fi
            sleep 10
          done

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Failed to join the server. Check the workflow run logs for details.'
            })
